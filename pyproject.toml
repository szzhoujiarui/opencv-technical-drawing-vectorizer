[project]
name = "tdv"
version = "0.1.0"
description = "Technical Drawing Vectorizer: OpenCV-based cleanup, geometry detection, and SVG export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "郑桥焯" }]
dependencies = [
    "opencv-python-headless~=4.10",
    "numpy~=2.1",
    "pypdfium2~=4.30",
    "pydantic~=2.9",
    "pyyaml~=6.0",
    "imageio~=2.36",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov~=5.0",
    "ruff~=0.7",
    "mypy~=1.13",
]

[project.scripts]
tdv-vectorize = "tdv.cli:main"
tdv-evaluate = "tdv.evaluate:main"
tdv-make-fixtures = "tdv.fixtures.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdv"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["tdv"]
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*", "numpy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tdv.fixtures.synth"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tdv.preprocess.grayscale", "tdv.preprocess.denoise", "tdv.preprocess.contrast",
          "tdv.preprocess.threshold", "tdv.preprocess.deskew", "tdv.preprocess.perspective",
          "tdv.io.load", "tdv.io.save",
          "tdv.geometry.lines", "tdv.geometry.circles", "tdv.geometry.arcs", "tdv.geometry.contours",
          "tdv.geometry.models", "tdv.pipeline", "tdv.report.overlay", "tdv.report.sidebyside",
          "tdv.report.metrics",
          "tdv.normalize.snap", "tdv.normalize.merge", "tdv.normalize.filter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
